<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>하늘마루 V5.4 · 휴대폰</title><link rel="stylesheet" href="style.css"><style>
#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#020e13}#touch{position:fixed;inset:0;touch-action:none}#phoneTop{position:fixed;top:8px;left:10px;right:10px;pointer-events:none;padding:10px;background:#03151ccb;border:1px solid #247b8155;z-index:2}#phoneTop h1{font-size:16px;margin:0}#phoneTop p{font-size:10px;margin:4px 0;color:#acd1d0}#phoneControls{position:fixed;left:10px;right:10px;bottom:48px;padding:12px;background:#041a22ee;border:1px solid var(--line);z-index:3;max-height:53dvh;overflow:auto;scrollbar-width:thin}#phoneControls label{margin:8px 0}#phoneControls button{min-height:38px}.phone-row{display:flex;gap:8px}.phone-row>*{flex:1;min-width:0}.phone-radar{position:fixed;right:10px;top:110px;width:125px;background:#03171cd9;border:1px solid var(--line);pointer-events:none;z-index:2}.phone-radar canvas{width:100%;display:block}.phone-radar #counters{grid-template-columns:repeat(4,1fr)}.phone-radar .counter{padding:3px}.phone-radar .counter b{font-size:13px}.phone-radar .counter span{font-size:8px}#menu{position:fixed;right:10px;bottom:8px;z-index:5}.clean #phoneControls{display:none}.clean #phoneTop #transport,.clean #phoneTop #gpu{display:none}.move-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;touch-action:none}.move-pad button{touch-action:none;user-select:none}.photo-row{display:flex;gap:12px;align-items:center}.photo-row #objectPhoto{width:90px;height:75px}.photo-row p{font-size:10px}.phone-caption{position:fixed;left:10px;bottom:12px;font-size:9px;color:#94c1be;max-width:68vw;z-index:3}.connection-off button:not(#start),.connection-off select{opacity:.6}
@media(orientation:landscape){#phoneTop{right:auto;width:37vw}#phoneControls{left:auto;right:10px;width:43vw;max-height:72dvh;bottom:48px}.phone-radar{left:10px;right:auto;top:120px;width:115px}.clean .phone-radar{width:95px}.phone-row select{padding:6px;font-size:11px}#phoneControls .modes{margin:6px 0}#phoneControls{padding:8px}#phoneControls button{padding:7px;min-height:34px;font-size:11px}}

#movePad[hidden]{display:none!important}#movePad{position:fixed;inset:0;pointer-events:none;z-index:4;--pad:clamp(46px,11vw,64px)}
.flight-pad{position:absolute;bottom:max(56px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none;display:grid;gap:6px}
.flight-pad button{width:var(--pad);height:var(--pad);padding:2px;font-size:12px;white-space:nowrap;font-weight:700;background:#071d2ce8;border:1px solid #75d9ebaa;border-radius:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.flight-pad button.pressed{background:#65e4c5;color:#032022;transform:scale(.96)}.flight-pad button:disabled{opacity:.4}
.flight-left{left:max(12px,env(safe-area-inset-left));grid-template-columns:repeat(3,var(--pad));grid-template-rows:repeat(3,var(--pad))}
.flight-left [data-move=forward][data-sign="1"]{grid-area:1/2}.flight-left [data-move=forward][data-sign="-1"]{grid-area:3/2}
.flight-left [data-move=side][data-sign="-1"]{grid-area:2/1}.flight-left [data-move=side][data-sign="1"]{grid-area:2/3}
.flight-left .pad-center{grid-area:2/2;display:grid;place-items:center;color:#91c9d6;font-size:11px;pointer-events:none}
.flight-right{right:max(14px,env(safe-area-inset-right));grid-template-rows:repeat(2,var(--pad));bottom:calc(max(56px,env(safe-area-inset-bottom)) + var(--pad)/2)}
#moveHint{position:absolute;bottom:38px;left:12px;font-size:10px;color:#adf8e7;text-shadow:0 1px 4px #000}
#moveStop{position:absolute;top:10px;right:10px;pointer-events:auto;min-height:40px;font-size:11px}
.manual-flight #phoneControls{bottom:268px;max-height:36dvh}.manual-flight #phoneTop{right:130px}
@media(orientation:landscape){#movePad{--pad:clamp(42px,10dvh,58px)}.manual-flight #phoneControls{bottom:48px;left:28%;right:23%;width:auto;max-height:70dvh}.manual-flight .phone-radar{top:100px;width:72px}.manual-flight #phoneTop{width:38vw}.manual-flight.clean .phone-radar{display:none}.flight-pad{bottom:48px}.flight-right{bottom:calc(48px + var(--pad)/2)}}
#arCamera,#arOverlay{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#arCamera{object-fit:cover;z-index:0}#arOverlay{z-index:1}#touch{z-index:2}#phoneTop,.phone-radar{z-index:3}.camera-ar #remote,.camera-ar .stream-surface{visibility:hidden!important}#arCamera[hidden],#arOverlay[hidden]{display:none}.ar-help{font-size:10px;color:#a4d8d3}
</style></head><body><video id="arCamera" autoplay muted playsinline hidden></video><canvas id="arOverlay" hidden></canvas><video id="remote" autoplay muted playsinline></video><div id="touch"></div><section id="phoneTop"><h1>하늘마루 V5.4 <small>REMOTE VIEW</small></h1><p id="status">PC 연결 시작을 누르세요.</p><p id="metric">PC가 렌더링 · 폰은 영상 수신 및 모드 전환</p><p id="transport"></p><p id="gpu"></p></section>
<div class="phone-radar"><canvas id="radar" width="240" height="240" aria-label="PC와 같은 2D 상황도"></canvas><div id="counters" class="counters"></div></div>
<section id="phoneControls"><div class="modes"><button id="start">PC 연결 시작</button><button id="flight">드론 시점</button><button id="game">합성 드론 게임</button></div><div class="modes"><button data-view="chase">추적</button><button data-view="cockpit">탑승</button><button data-view="overview">전체 3D</button><button data-view="map">2D 지도</button></div>
<div class="modes"><button id="environment">카메라 AR 켜기</button></div><p class="ar-help" id="arHint">가상환경 · AR은 선택 드론 시점을 카메라 위에 합성합니다.</p><div class="phone-row"><label>드론 선택<select id="selected"></select></label><label>이동<select id="pilot"><option value="auto">자동 관찰</option><option value="manual">직접 이동</option></select></label></div>
<div class="modes"><button id="spawn">＋ 미확인</button><button id="pause">일시정지</button><button id="reset">정면 복귀</button><button id="restart">초기화</button></div><label class="check"><input id="autoArrival" type="checkbox" checked> 미확인 자동 등장</label>

<details><summary>객체 정보 · 전송 · 객체 수</summary><div class="photo-row"><div><b id="objectName"></b><p id="objectColor"></p><p id="objectPosition"></p><p>합성 게임 객체</p></div></div><label>전송 화질<select id="streamQuality"><option value="smooth">부드럽게 960</option><option value="balanced">균형 1280</option><option value="sharp" selected>선명 1920</option><option value="ultra">최고 2560</option></select></label><label>기본 파랑 드론 <output id="countText">24</output><input id="count" type="range" min="1" max="200" value="24"></label><ol id="events"></ol></details></section>
<div id="movePad" hidden aria-label="직접 비행 터치 조작">
<div class="flight-pad flight-left" aria-label="수평 이동">
<button data-move="forward" data-sign="1" aria-label="전진">▲<br>전진</button><button data-move="side" data-sign="-1" aria-label="왼쪽 이동">◀<br>좌측</button><span class="pad-center">이동</span><button data-move="side" data-sign="1" aria-label="오른쪽 이동">▶<br>우측</button><button data-move="forward" data-sign="-1" aria-label="후진">▼<br>후진</button></div>
<div class="flight-pad flight-right" aria-label="높이 이동"><button data-move="up" data-sign="1" aria-label="상승">＋<br>상승</button><button data-move="up" data-sign="-1" aria-label="하강">−<br>하강</button></div>
<span id="moveHint"></span><button id="moveStop">자동 관찰 복귀</button></div><span class="phone-caption">양재·아크 강남 · © OSM contributors (ODbL) · 높이 일부 추정<br>합성 시나리오 · 무작위 분류 · <span id="missionLabel"></span> / <span id="simTime">00:00</span></span><button id="menu">몰입 화면</button><script type="module" src="receiver.js"></script></body></html>
